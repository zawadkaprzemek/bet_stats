services:
  nginx:
    image: nginx:1.27-alpine
    container_name: bet_stats_nginx
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bet_stats_backend
    working_dir: /var/www/app
    volumes:
      - ./backend:/var/www/app
    command: sh -c "if [ -f composer.json ] && [ ! -d vendor ]; then composer install; fi && php bin/console assets:install public && php-fpm"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: mysql://${MYSQL_USER:-bet_stats}:${MYSQL_PASSWORD:-bet_stats}@db:3306/${MYSQL_DATABASE:-bet_stats}?serverVersion=8.4.0&charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bet_stats_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "if [ -f package.json ]; then npm run dev -- --host 0.0.0.0; else tail -f /dev/null; fi"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_BACKEND_PROXY_TARGET: http://nginx
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

  db:
    image: mysql:8.4
    container_name: bet_stats_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bet_stats}
      MYSQL_USER: ${MYSQL_USER:-bet_stats}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bet_stats}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
  frontend_node_modules:
